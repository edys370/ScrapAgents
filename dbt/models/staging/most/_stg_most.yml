# Generated by `scrapagents generate-dbt` from configs/contracts/most/funding_opportunities.yml.
# Do not edit: change the contract and regenerate.
version: 2
models:
- name: stg_most__funding_opportunities
  description: 'Public science-and-technology plan funding notices (科技计划通知公告) published on the National
    Science and Technology Management Information System public service platform (service.most.gov.cn):
    title, issuing unit (来源), publish date, canonical detail URL and notice body text. Scope is the kjjh_tztg
    listing iframe and kjjh_tztg_all detail pages only. Content copyright claimed by MOST; attribution
    (source_url, issuing_unit, publish_date) travels with every record. Intended use is internal Opportunity
    Intelligence indexing, not commercial verbatim republication (网站声明 accepted at Gate H1). Typed and
    row-preserving: one row per record per landed payload.'
  meta:
    layer: staging
    owner: data_team_sistemas_internos
    source_system: most
    dataset: funding_opportunities
    grain: One 科技计划通知公告 notice as listed on service.most.gov.cn/kjjh_tztg and detailed under /kjjh_tztg_all/YYYYMMDD/<notice_id>.html,
      identified by notice_id, in one full-scope read of all listing pages.
    generated: true
  columns:
  - name: notice_id
    description: Numeric identifier of the notice, last path segment of the detail URL without the .html
      suffix (for example 5935 from /kjjh_tztg_all/20261112/5935.html). Stable across listing pages and
      detail fetches; used as the bronze and persistence key.
    meta:
      classification: public
    data_tests:
    - not_null
  - name: source_url
    description: Absolute canonical URL of the notice detail page on service.most.gov.cn (https://service.most.gov.cn/kjjh_tztg_all/YYYYMMDD/<notice_id>.html).
      Attribution and lineage to the source page.
    meta:
      classification: public
    data_tests:
    - not_null
  - name: title
    description: Full notice title. Prefer .article__title on the detail page; fall back to the listing
      div[onclick] title attribute when the detail body is unavailable.
    meta:
      classification: public
    data_tests:
    - not_null
  - name: issuing_unit
    description: Institutional issuing unit / 来源 as shown on the listing row and in .article__subTitle
      (for example 广东省科学技术厅, 科学技术部). Source-local label, not a Party identifier.
    meta:
      classification: public
    data_tests:
    - not_null
  - name: publish_date
    description: Publication date as YYYY-MM-DD. Prefer the listing table date column; cross-check against
      发布时间 in .article__subTitle and the YYYYMMDD segment of the detail path.
    meta:
      classification: public
    data_tests:
    - not_null
  - name: body_text
    description: Plain text of .article-body on the detail page, converted from HTML by the extractor
      with fixed rules. May contain contact persons, phones and emails published in the notice. Null only
      if the detail page has no article body.
    meta:
      classification: personal
      purpose: Notice body needed to match funding opportunities to research profiles in Producto OI.
        Detail HTML commonly embeds 联系人 (named natural persons acting for an institution), phone numbers
        and emails; those person-level contacts must be stripped or masked when projecting to Producto
        OI and must not feed Party. Raw HTML in Landing retains the unmodified source for lineage.
    tags:
    - pii
  - name: listing_url
    description: Absolute URL of the kjjh_tztg listing page from which this notice was read in the run
      (index.html or index_N.html). Provenance only; listed in persistence.ignore_fields.
    meta:
      classification: public
    data_tests:
    - not_null
  - name: retrieved_at
    description: UTC time the extractor read the notice in this run. Listed in persistence.ignore_fields
      (changes every run without a content change).
    meta:
      classification: public
    data_tests:
    - not_null
  - name: bronze_batch_id
    description: Batch (landed payload) this record came from; same bytes, same batch.
    data_tests:
    - not_null
  - name: bronze_record_hash
    description: SHA-256 of the record as landed, to detect changes between batches.
    data_tests:
    - not_null
  - name: bronze_landing_uri
    description: Landing object the record was read from (provenance).
    data_tests:
    - not_null
  - name: bronze_ingested_at
    description: When the RustWorker loaded that payload into bronze.
    data_tests:
    - not_null
