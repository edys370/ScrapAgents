# Generated by `scrapagents generate-dbt` from configs/contracts/daad/funding_programmes.yml.
# Do not edit: change the contract and regenerate.
version: 2
models:
- name: int_daad__funding_programmes
  description: 'Institutional funding programmes and thematic HEI cooperation initiatives published by
    the Deutscher Akademischer Austauschdienst e.V. (DAAD) for higher education institutions: titles,
    summaries, thematic focus, Imperia publish dates (when present on the listing) and canonical detail
    URLs parsed from four listing-only SSR pages on www.daad.de (German A–Z catalogue and English HEI
    overview / cooperation pages). Detail pages are out of scope. Current version: latest ingested row
    per primary key (programme_id).'
  meta:
    layer: intermediate
    owner: data_team_sistemas_internos
    source_system: daad
    dataset: funding_programmes
    grain: One DAAD institutional funding programme or thematic HEI initiative as it appears on one of
      the four listing pages in a full listing-only read, identified by programme_id ({language}:{programme_slug}).
      The same initiative on EN and DE listings is intentionally two grains when both listings expose
      it (no cross-language merge without a detail crawl).
    generated: true
  columns:
  - name: programme_id
    description: 'Stable unique key for bronze and persistence: "{language}:{programme_slug}" (for example
      de:hochschulpartnerschaften or en:campus-initiative-international-academic-experts). Language prefix
      prevents collisions between EN thematic paths and DE A–Z catalogue slugs.'
    meta:
      classification: public
    data_tests:
    - not_null
    - unique
  - name: programme_slug
    description: Last path segment of the programme's detail href as shown on the listing page (for example
      the slug under .../weiterfuehrende-infos-zu-daad-foerderprogrammen/<slug>/ or the English thematic
      page path). Not unique alone across languages; always combined with language in programme_id.
    meta:
      classification: public
    data_tests:
    - not_null
  - name: title
    description: Official programme or initiative title as published on the DAAD HEI listing pages.
    meta:
      classification: public
    data_tests:
    - not_null
  - name: summary
    description: Short institutional summary or eligibility overview shown next to the programme on the
      listing or catalogue page (listing text only; detail-page body is not fetched).
    meta:
      classification: public
  - name: thematic_focus
    description: Thematic grouping when present on the listing (for example Refugees at higher education
      institutions, Sustainable development, Campus Initiative for International Talents, DWIH).
    meta:
      classification: public
  - name: language
    description: Language of the listing page that supplied the record (de or en). Forms the first segment
      of programme_id.
    meta:
      classification: public
    data_tests:
    - not_null
  - name: page_kind
    description: 'Origin of the record in this run: catalogue_programme (German A–Z HEI funding catalogue
      listing) or thematic_initiative (English HEI overview / cooperation listing pages).'
    meta:
      classification: public
    data_tests:
    - not_null
  - name: publish_date
    description: Imperia CMS publishDate when exposed on the listing page metadata or __NUXT_DATA__ (YYYY-MM-DD).
      Null when the listing does not expose it; detail pages are not fetched to obtain a missing date.
    meta:
      classification: public
  - name: source_url
    description: Absolute URL of the programme or initiative detail page as linked from the listing (attribution
      to DAAD). Stored for lineage; the extractor does not GET this URL in the listing-only scope.
    meta:
      classification: public
    data_tests:
    - not_null
  - name: listing_url
    description: Absolute URL of the listing page from which the extractor read this programme in the
      run (exactly one of the four HEI SSR listing pages in scope).
    meta:
      classification: public
    data_tests:
    - not_null
  - name: bronze_batch_id
    description: Batch (landed payload) this record came from; same bytes, same batch.
    data_tests:
    - not_null
  - name: bronze_record_hash
    description: SHA-256 of the record as landed, to detect changes between batches.
    data_tests:
    - not_null
  - name: bronze_landing_uri
    description: Landing object the record was read from (provenance).
    data_tests:
    - not_null
  - name: bronze_ingested_at
    description: When the RustWorker loaded that payload into bronze.
    data_tests:
    - not_null
