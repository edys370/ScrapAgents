# Draft contract: most / funding_opportunities
# Becomes configs/contracts/most/funding_opportunities.yml in this repository (phase 4).
# Rules: scrapagents.contracts (`make check-contracts`).
#
# How a record is born (deterministic, no LLM): the extractor walks every static listing page
# under https://service.most.gov.cn/kjjh_tztg/ (index.html, then index_2.html … index_N.html,
# N from the footer "共M条记录 1/N页"), parses each <tr> (title via div[onclick].title,
# issuing unit, publish date YYYY-MM-DD, detail path from openW('/kjjh_tztg_all/YYYYMMDD/<id>.html')),
# GETs each in-scope detail HTML through scrapagents.stealth (Obscura over CDP), parses
# .article__title, .article__subTitle (发布时间 / 来源) and .article-body with fixed selectors,
# and streams ONE JSON document {"records": [...]} to RustWorker. Every record is a flat object
# whose keys are exactly the column names below. PDF attachments and secondary portals are out
# of scope (binary_to_tika stays empty).
source_system: most
dataset: funding_opportunities
description: >
  Public science-and-technology plan funding notices (科技计划通知公告) published on the National
  Science and Technology Management Information System public service platform
  (service.most.gov.cn): title, issuing unit (来源), publish date, canonical detail URL and notice
  body text. Scope is the kjjh_tztg listing iframe and kjjh_tztg_all detail pages only. Content
  copyright claimed by MOST; attribution (source_url, issuing_unit, publish_date) travels with
  every record. Intended use is internal Opportunity Intelligence indexing, not commercial
  verbatim republication (网站声明 accepted at Gate H1).
owner: data_team_sistemas_internos
grain: >
  One 科技计划通知公告 notice as listed on service.most.gov.cn/kjjh_tztg and detailed under
  /kjjh_tztg_all/YYYYMMDD/<notice_id>.html, identified by notice_id, in one full-scope read of
  all listing pages.
personal_data: true
primary_key:
  - notice_id
columns:
  - name: notice_id
    type: string
    required: true
    classification: public
    description: >
      Numeric identifier of the notice, last path segment of the detail URL without the .html
      suffix (for example 5935 from /kjjh_tztg_all/20261112/5935.html). Stable across listing
      pages and detail fetches; used as the bronze and persistence key.

  - name: source_url
    type: string
    required: true
    classification: public
    description: >
      Absolute canonical URL of the notice detail page on service.most.gov.cn
      (https://service.most.gov.cn/kjjh_tztg_all/YYYYMMDD/<notice_id>.html). Attribution and
      lineage to the source page.

  - name: title
    type: string
    required: true
    classification: public
    description: >
      Full notice title. Prefer .article__title on the detail page; fall back to the listing
      div[onclick] title attribute when the detail body is unavailable.

  - name: issuing_unit
    type: string
    required: true
    classification: public
    description: >
      Institutional issuing unit / 来源 as shown on the listing row and in .article__subTitle
      (for example 广东省科学技术厅, 科学技术部). Source-local label, not a Party identifier.

  - name: publish_date
    type: date
    required: true
    classification: public
    description: >
      Publication date as YYYY-MM-DD. Prefer the listing table date column; cross-check against
      发布时间 in .article__subTitle and the YYYYMMDD segment of the detail path.

  - name: body_text
    type: string
    required: false
    classification: personal
    purpose: >
      Notice body needed to match funding opportunities to research profiles in Producto OI.
      Detail HTML commonly embeds 联系人 (named natural persons acting for an institution),
      phone numbers and emails; those person-level contacts must be stripped or masked when
      projecting to Producto OI and must not feed Party. Raw HTML in Landing retains the
      unmodified source for lineage.
    description: >
      Plain text of .article-body on the detail page, converted from HTML by the extractor with
      fixed rules. May contain contact persons, phones and emails published in the notice.
      Null only if the detail page has no article body.

  - name: listing_url
    type: string
    required: true
    classification: public
    description: >
      Absolute URL of the kjjh_tztg listing page from which this notice was read in the run
      (index.html or index_N.html). Provenance only; listed in persistence.ignore_fields.

  - name: retrieved_at
    type: timestamp
    required: true
    classification: public
    description: >
      UTC time the extractor read the notice in this run. Listed in persistence.ignore_fields
      (changes every run without a content change).

not_extracted:
  - name: contact_person
    classification: personal
    reason: >
      Named 联系人 in notice bodies identify natural persons. Not parsed into a dedicated column
      (formats vary by notice); remain only inside body_text and raw detail HTML in Landing.
      Minimization: do not promote to Staging or Producto OI as a contact field.
  - name: contact_phone
    classification: personal
    reason: >
      Phone numbers next to 联系人 / 电话 in notice bodies. Not needed as a structured bronze
      column for opportunity matching; remain in body_text / Landing only.
  - name: contact_email
    classification: personal
    reason: >
      Email addresses published for declaration windows. Not extracted as a dedicated column;
      remain in body_text and raw HTML in Landing. Must not feed Party or public Producto OI
      surfaces without masking.
