# Generated by `scrapagents generate-dags` from configs/ingestions/most.yml.
# Do not edit by hand: change the source config and regenerate (`make generate-dags`).
# Declarative only (Airflow YAML importer, AIP-85): no Python and no LLM at run-time.
$schema: https://airflow.apache.org/schemas/dag/2026-10-30.json
dag_id: ingest__most
description: "Daily full-scope ingest of public 科技计划通知公告 (science & technology plan funding notices) from service.most.gov.cn/kjjh_tztg listing pages and /kjjh_tztg_all detail HTML, keyed by notice_id, for internal Opportunity Intelligence with source attribution.\n"
schedule: "0 7 * * *"
start_date: 2026-01-01
catchup: false
max_active_runs: 1
tags: ["ingestion", "source_most", "web", "sistemas_internos"]
tasks:
  - id: runtime_ready
    uses: airflow.providers.standard.operators.bash.BashOperator
    retries: 2
    retry_delay: 5m
    with:
      bash_command: "python -m scrapagents.cli check-runtime"
  - id: land__funding_opportunities
    needs: [runtime_ready]
    uses: airflow.providers.standard.operators.bash.BashOperator
    pool: "most_source"
    retries: 2
    retry_delay: 5m
    execution_timeout: 4h
    with:
      bash_command:
        $t: "python -m scrapagents.extractors.most --dataset funding_opportunities --ingest-date {{ (dag_run.logical_date or dag_run.run_after).strftime('%Y-%m-%d') }}"
  - id: landed
    needs: ["land__funding_opportunities"]
    uses: airflow.providers.standard.operators.empty.EmptyOperator
  - id: dbt_build
    needs: [landed]
    uses: airflow.providers.standard.operators.bash.BashOperator
    retries: 2
    retry_delay: 5m
    with:
      bash_command: "cd \"$DBT_PROJECT_DIR\" && \"$DBT_BIN\" build --select tag:source_most"
