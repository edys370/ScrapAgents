# Generated by `scrapagents generate-dags` from configs/ingestions/daad.yml.
# Do not edit by hand: change the source config and regenerate (`make generate-dags`).
# Declarative only (Airflow YAML importer, AIP-85): no Python and no LLM at run-time.
$schema: https://airflow.apache.org/schemas/dag/2026-10-30.json
dag_id: ingest__daad
description: "Weekly listing-only ingest (exactly four SSR pages, no detail crawl) of institutional funding programmes and thematic HEI cooperation initiatives published by the Deutscher Akademischer Austauschdienst e.V. (DAAD) on www.daad.de. Records keyed by language-prefixed programme_id.\n"
schedule: "0 6 * * 2"
start_date: 2026-01-01
catchup: false
max_active_runs: 1
tags: ["ingestion", "source_daad", "web", "sistemas_internos"]
tasks:
  - id: runtime_ready
    uses: airflow.providers.standard.operators.bash.BashOperator
    retries: 2
    retry_delay: 5m
    with:
      bash_command: "python -m scrapagents.cli check-runtime"
  - id: land__funding_programmes
    needs: [runtime_ready]
    uses: airflow.providers.standard.operators.bash.BashOperator
    pool: "daad_source"
    retries: 2
    retry_delay: 5m
    execution_timeout: 1h
    with:
      bash_command:
        $t: "python -m scrapagents.extractors.daad --dataset funding_programmes --ingest-date {{ (dag_run.logical_date or dag_run.run_after).strftime('%Y-%m-%d') }}"
  - id: landed
    needs: ["land__funding_programmes"]
    uses: airflow.providers.standard.operators.empty.EmptyOperator
  - id: dbt_build
    needs: [landed]
    uses: airflow.providers.standard.operators.bash.BashOperator
    retries: 2
    retry_delay: 5m
    with:
      bash_command: "cd \"$DBT_PROJECT_DIR\" && \"$DBT_BIN\" build --select tag:source_daad"
